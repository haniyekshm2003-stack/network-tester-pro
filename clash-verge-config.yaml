# Clash Verge Pro Configuration
# VPN Pro - Iran Optimized
# تاریخ: 29 ژانویه 2026

mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

dns:
  enable: true
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 8.8.8.8
    - 1.1.1.1
  fallback:
    - tls://8.8.8.8:853
    - tls://1.1.1.1:853

proxies:
  # 🚀 سرور اصلی - VLESS Reality (سریع‌ترین)
  - name: "🚀 VPN-Pro-Reality"
    type: vless
    server: 108.128.15.3
    port: 443
    uuid: b393ccbc-1415-4a80-aa67-0fbecd48dfc1
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: www.google.com
    reality-opts:
      public-key: psSn6aZembYfCAHBMYrDNfR7qYIr3Uek-2Oe3st1_0g
      short-id: abc123def456
    client-fingerprint: chrome

  # 🌐 IP بکاپ 1
  - name: "🌐 VPN-IP2-Reality"
    type: vless
    server: 63.32.250.131
    port: 443
    uuid: b393ccbc-1415-4a80-aa67-0fbecd48dfc1
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: www.google.com
    reality-opts:
      public-key: psSn6aZembYfCAHBMYrDNfR7qYIr3Uek-2Oe3st1_0g
      short-id: abc123def456
    client-fingerprint: chrome

  # 🌐 IP بکاپ 2
  - name: "🌐 VPN-IP3-Reality"
    type: vless
    server: 34.247.23.138
    port: 443
    uuid: b393ccbc-1415-4a80-aa67-0fbecd48dfc1
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
