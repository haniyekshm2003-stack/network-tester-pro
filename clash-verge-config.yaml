proxy-groups:
  - name: "🔰 انتخاب پروکسی"
    type: select
    proxies:
      - "🚀 VPN-Pro-Reality"
      - "🌐 VPN-IP2-Reality"
      - "🌐 VPN-IP3-Reality"
      - "📡 VPN-WebSocket"
      - "♻️ بهترین پینگ"
      - DIRECT

  - name: "♻️ بهترین پینگ"
    type: url-test
    proxies:
      - "🚀 VPN-Pro-Reality"
      - "🌐 VPN-IP2-Reality"
      - "🌐 VPN-IP3-Reality"
    url: http://www.gstatic.com/generate_204
    interval: 300

  - name: "📺 استریم"
    type: select
    proxies:
      - "🔰 انتخاب پروکسی"
      - "🚀 VPN-Pro-Reality"
      - DIRECT

  - name: "💬 پیام‌رسان"
    type: select
    proxies:
      - "🔰 انتخاب پروکسی"
      - "🚀 VPN-Pro-Reality"

rules:
  # سایت‌های ایرانی - مستقیم
  - DOMAIN-SUFFIX,ir,DIRECT
  - DOMAIN-KEYWORD,iran,DIRECT
  
  # تلگرام
  - DOMAIN-SUFFIX,telegram.org,💬 پیام‌رسان
  - DOMAIN-SUFFIX,t.me,💬 پیام‌رسان
  - IP-CIDR,91.108.0.0/16,💬 پیام‌رسان
  - IP-CIDR,149.154.0.0/16,💬 پیام‌رسان
  
  # واتساپ
  - DOMAIN-SUFFIX,whatsapp.com,💬 پیام‌رسان
  - DOMAIN-SUFFIX,whatsapp.net,💬 پیام‌رسان
  
  # یوتیوب و گوگل
  - DOMAIN-SUFFIX,youtube.com,📺 استریم
  - DOMAIN-SUFFIX,googlevideo.com,📺 استریم
  - DOMAIN-SUFFIX,ytimg.com,📺 استریم
  
  # اینستاگرام
  - DOMAIN-SUFFIX,instagram.com,📺 استریم
  - DOMAIN-SUFFIX,cdninstagram.com,📺 استریم
  
  # توییتر
  - DOMAIN-SUFFIX,twitter.com,📺 استریم
  - DOMAIN-SUFFIX,x.com,📺 استریم
  - DOMAIN-SUFFIX,twimg.com,📺 استریم
  
  # سایر
  - MATCH,🔰 انتخاب پروکسی
